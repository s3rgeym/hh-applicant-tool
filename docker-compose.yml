services:
  # Для разовых команд:
  # docker compose run --rm hh_applicant_tool <аргументы>
  hh_applicant_tool:
    image: hh_applicant_tool:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['manual']
    restart: 'no'
    volumes:
      - .:/app:ro
      - ./config:/app/config:rw
      # Пробрасываем таймзону хоста
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Это не трогаем
      CONFIG_DIR: /app/config
      # Смените или закомментируйте при проблемах
      TERM: ${TERM}
      # Если время на сервере отличается
      # TZ: Europe/Moscow

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: hh_ofelia
    restart: unless-stopped
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.enabled: 'true'

      # Раз в сутки
      ofelia.job-run.apply-vacancies.schedule: '@every 24h'
      ofelia.job-run.apply-vacancies.image: 'hh_applicant_tool:latest'
      ofelia.job-run.apply-vacancies.command: 'apply-vacancies'
      ofelia.job-run.apply-vacancies.volume: '${PWD}:/app:ro,${PWD}/config:/app/config:rw,/etc/localtime:/etc/localtime:ro'
      ofelia.job-run.apply-vacancies.environment: 'CONFIG_DIR=/app/config'

      # Раз в 4 часа
      ofelia.job-run.update-resumes.schedule: '@every 4h'
      ofelia.job-run.update-resumes.image: 'hh_applicant_tool:latest'
      ofelia.job-run.update-resumes.command: 'update-resumes'
      ofelia.job-run.update-resumes.volume: '${PWD}:/app:ro,${PWD}/config:/app/config:rw,/etc/localtime:/etc/localtime:ro'
      ofelia.job-run.update-resumes.environment: 'CONFIG_DIR=/app/config'

      # Раз в 5 минут
      ofelia.job-run.reply-chats.schedule: '@every 5m'
      ofelia.job-run.reply-chats.image: 'hh_applicant_tool:latest'
      ofelia.job-run.reply-chats.command: 'reply-chats'
      ofelia.job-run.reply-chats.volume: '${PWD}:/app:ro,${PWD}/config:/app/config:rw,/etc/localtime:/etc/localtime:ro'
      ofelia.job-run.reply-chats.environment: 'CONFIG_DIR=/app/config'
